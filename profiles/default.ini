; VRLayer default profile.
;
; Copy to ~/.config/vrlayer/default.ini to change defaults for every game, or
; to ~/.config/vrlayer/games/<SteamAppId>.ini for a single game. Every value
; can also be changed live with `vrlayer-ctl set <section.key> <value>` and
; written to the game's profile with `vrlayer-ctl save`.

[display]
; theater   = big virtual screen, works with every game
; immersive = game fills your view at its own FOV, head look via mouse
; vr        = your head pose is written into the game camera (6DOF); needs
;             the camera to be found by the loading screen
; Not set here: by default every game starts in the mode the loading screen
; recommends. Set it (here or per game) to force one.
; mode = theater
; Theater screen: distance and width in metres, vertical offset from eye level.
screen_distance = 3.0
screen_width = 4.0
screen_height = 0.0
; Curved screen (needs XR_KHR_composition_layer_cylinder in the runtime).
curved = true
; Immersive: the game's HORIZONTAL field of view, so objects appear at their
; real size. Detected automatically on the loading screen; set it only to
; override the detection (built-in fallback: 90).
; game_fov = 90
immersive_distance = 2.0
; How old (ms) the game camera is when a frame arrives; raise it if the image
; seems to swim when you turn your head in immersive mode.
immersive_latency_ms = 0
; Virtual room (sky + floor) around the screen.
environment = true

[stereo]
; Stereo 3D reconstructed from the game's depth buffer.
enabled = true
; Maximum parallax as a fraction of the image width (strength of the effect).
separation = 0.015
; Depth that sits on the screen plane; smaller = more pops out of the screen.
convergence = 0.03
; Limit for pop-out (negative parallax) as a fraction of separation.
popout = 0.5
; Reversed-Z games (most D3D11/12 titles) are detected automatically.
depth_reversed = auto
; Depth linearization constant; raise for games with very deep scenes.
depth_far_plane = 1000
depth_flip_y = false
; Quality of the reprojection (cost grows linearly).
search_steps = 24
; Show the depth buffer instead of the image (for tuning).
show_depth = false
; When the camera lens was detected, depth is exact and the screen plane sits
; this many near-plane distances away (replaces convergence/depth_far_plane).
convergence_near = 30

[vr]
; head      = every frame rendered from your head pose; stereo from depth
; alternate = frames alternate between your left and right eye (true stereo,
;             each eye gets half the game's frame rate)
camera = head
; Game units per metre (Unreal Engine: 100, most others: 1).
units_per_metre = 1
ipd = 0.064
; auto = aim with your head when mouse look is calibrated (crosshair follows
; your view), body = head only moves the view, the game aims as before.
aim = auto
; keyboard_mouse scheme: right stick flick turns by this many degrees (0 = smooth).
snap_turn = 30
turn_speed = 120
; The game's camera does not follow the mouse or stick (table, puzzle and
; point-and-click games): skip the gameplay check and use it for VR. The
; loading room saves this when you press START on such a camera.
fixed_camera = false
; Show the VR room around the game's field of view (otherwise black). Raise
; the game's own FOV setting to see more of the game world around you.
show_room = false

[loading]
; VR loading room shown while the game starts; it finds the depth buffer,
; the camera lens and position, calibrates mouse look and picks a mode.
enabled = true
auto_continue = true
; Seconds before starting with whatever was found.
timeout = 120
calibrate_mouse = true

[input]
; Turn the game camera with your head in immersive mode (virtual mouse).
head_mouse = true
; Mouse counts per degree of head rotation. Measured automatically on the
; loading screen (saved to games/<appid>.auto.ini); set it only to override.
; If the world drifts when you turn your head, adjust until it stays still.
; mouse_counts_per_degree = 30
mouse_invert_y = false
head_mouse_pitch = true
; VR controllers act as an Xbox 360 controller.
gamepad = true
; gamepad | keyboard_mouse (for games without controller support; see [bindings])
scheme = gamepad
; Point at the screen with a controller or hand to move the mouse; trigger or
; pinch clicks.
pointer = true
; Hands without controllers: index pinch = trigger, middle pinch = A (right) / B (left).
hand_tracking = true
; VR mode: the game's mouse cursor follows your hand as seen through the game
; camera, so a mouse-controlled hand / tool in the game is where your hand is.
; Trigger (or pinch) = left click, grip (or middle pinch) = right click.
;   absolute: moves the cursor (games that show a cursor or read its position)
;   relative: sends mouse motion (games that lock the cursor)
hand_mouse = off
hand_mouse_hand = right
; Metres from the controller to the tool tip (the point that drives the cursor).
hand_mouse_offset = 0.12
; relative mode: mouse counts per screen pixel (1 without mouse acceleration).
hand_mouse_counts_per_pixel = 1

; [bindings]  keyboard_mouse scheme overrides, e.g.
; a = space
; rt = mouse_left
; move_forward = w
