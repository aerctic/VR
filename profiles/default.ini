; VRLayer default profile.
;
; Copy to ~/.config/vrlayer/default.ini to change defaults for every game, or
; to ~/.config/vrlayer/games/<SteamAppId>.ini for a single game. Every value
; can also be changed live with `vrlayer-ctl set <section.key> <value>` and
; written to the game's profile with `vrlayer-ctl save`.

[display]
; theater   = big virtual screen, works with every game
; immersive = game fills your view at its own FOV, head look via mouse
mode = theater
; Theater screen: distance and width in metres, vertical offset from eye level.
screen_distance = 3.0
screen_width = 4.0
screen_height = 0.0
; Curved screen (needs XR_KHR_composition_layer_cylinder in the runtime).
curved = true
; Immersive: set this to the game's HORIZONTAL field of view so objects
; appear at their real size.
game_fov = 90
immersive_distance = 2.0
; How old (ms) the game camera is when a frame arrives; raise it if the image
; seems to swim when you turn your head in immersive mode.
immersive_latency_ms = 0

[stereo]
; Stereo 3D reconstructed from the game's depth buffer.
enabled = true
; Maximum parallax as a fraction of the image width (strength of the effect).
separation = 0.015
; Depth that sits on the screen plane; smaller = more pops out of the screen.
convergence = 0.03
; Limit for pop-out (negative parallax) as a fraction of separation.
popout = 0.5
; Reversed-Z games (most D3D11/12 titles) are detected automatically.
depth_reversed = auto
; Depth linearization constant; raise for games with very deep scenes.
depth_far_plane = 1000
depth_flip_y = false
; Quality of the reprojection (cost grows linearly).
search_steps = 24
; Show the depth buffer instead of the image (for tuning).
show_depth = false

[input]
; Turn the game camera with your head in immersive mode (virtual mouse).
head_mouse = true
; Mouse counts per degree of head rotation. Tune per game: if the world
; drifts when you turn your head, adjust until it stays still.
mouse_counts_per_degree = 30
mouse_invert_y = false
head_mouse_pitch = true
; VR controllers act as an Xbox 360 controller.
gamepad = true
